name: Natives smoke

# Runs the native desktop tests against the natives of a draft release, before it is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose draft release carries the desktop natives
        required: true

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # Draft releases are visible only with write access.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      # gradlew must keep LF endings to run under bash on Windows.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP needs the SDK and NDK of scripts/install-android-sdk.sh to configure the module.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 ndk;27.0.12077973'

      - name: Download the natives of the draft release
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir natives-download
          cd natives-download
          if command -v sha256sum > /dev/null; then sha256sum -c natives.sha256; else shasum -a 256 -c natives.sha256; fi
          cd ..
          mkdir -p natives/desktop/prebuilt
          for target in linux-x64 macos-arm64 windows-x64; do
            tar -xzf "natives-download/monerokit-desktop-$target.tar.gz" -C natives/desktop/prebuilt
          done

      - name: Create local.properties
        run: touch local.properties

      - name: Run native tests
        run: ./gradlew :monerokit:desktopNativeTest
