name: Publish to Maven (GitHub Pages)

on:
  push:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: touch local.properties

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and publish to local repo
        run: ./gradlew :monerokit:publishReleasePublicationToLocalRepository
        env:
          SHORT_SHA: ${{ env.SHORT_SHA }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        continue-on-error: true

      - name: Create gh-pages branch if missing
        run: |
          if [ ! -d "gh-pages/.git" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git checkout -b gh-pages
          fi

      - name: Copy artifacts to gh-pages
        run: |
          cp -r monerokit/build/maven-repo/* gh-pages/

      - name: Keep only last 20 versions
        run: |
          REPO_PATH="gh-pages/com/github/piratecash/monero-kit-android"
          if [ -d "$REPO_PATH" ]; then
            cd "$REPO_PATH"
            ls -dt */ | tail -n +21 | xargs -r rm -rf
          fi

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Publish ${{ env.SHORT_SHA }}"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin gh-pages
